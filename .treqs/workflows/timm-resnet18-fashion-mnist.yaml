name: timm-resnet18-fashion-mnist reproduction

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag. Adjust commands as needed.

secrets:
  - HF_TOKEN            # wandb->trackio sync + roar put upload

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    python -V
    # timm's own declared runtime deps. NOT `pip install -e .` — an editable
    # self-install is never captured in a freeze and blinds the tracer to the repo
    # (every step would record zero inputs). `python train.py` from the repo root
    # imports the checked-out ./timm package directly.
    python -m pip install --quiet -r requirements.txt \
      || sudo "$(command -v python)" -m pip install --quiet -r requirements.txt
    rm -rf *.egg-info src/*.egg-info
    # Assert NO `timm` *distribution* is visible: if one were, the freeze would pin
    # a PyPI timm that is not the code being run.
    python -c "import importlib.metadata as m,sys; d=[x for x in m.distributions() if (x.metadata['Name'] or '').lower()=='timm']; print('timm distributions visible:', [x.version for x in d]); sys.exit(1 if d else 0)"
    python -c "import timm,os; p=os.path.abspath(timm.__file__); print('timm package ->', p, timm.__version__); assert p.startswith(os.getcwd()), 'timm resolved OUTSIDE the checkout'"
    # --- roar: purge any host copy, then install the published 0.4.4rc2 ---------
    # Purge is bigger than it looks: deleting only .dist-info leaves an importable
    # roar/ package dir behind and a bare /usr/local/bin/roar has been caught using
    # it. Never pipe rm into head — head exits, rm takes SIGPIPE and dies mid-list
    # while still reporting success.
    sudo rm -rf /usr/local/lib/python3.10/dist-packages/roar_cli-*.dist-info \
                /usr/local/lib/python3.10/dist-packages/roar \
                /opt/pytorch/lib/python3.12/site-packages/roar_cli-*.dist-info \
                /opt/pytorch/lib/python3.12/site-packages/roar \
                /usr/local/bin/roar /usr/local/bin/roar-worker \
                /opt/pytorch/bin/roar /opt/pytorch/bin/roar-worker \
                /usr/local/lib/python3.10/dist-packages/roar_inject.pth \
                /opt/pytorch/lib/python3.12/site-packages/roar_inject.pth
    # Build identity is the sha256, not the version string. Verify the published
    # linux x86_64 wheel's digest against the index before installing it.
    curl -sS https://test.pypi.org/pypi/roar-cli/0.4.4rc2/json -o /tmp/roar_meta.json
    python -c "import json,sys; d=json.load(open('/tmp/roar_meta.json')); g={f['filename']: f['digests']['sha256'] for f in d['urls']}; print(json.dumps(g, indent=1)); want='3677618d4c42d66143baf42912c8ed932f9706d5511d032bb2898fda6a465471'; sys.exit(0 if want in g.values() else 1)"
    # `uv` is NOT on PATH on this AMI. Look in the usual per-user bin dirs first,
    # and bootstrap it if it genuinely is not installed.
    echo "user=$(id -un) home=$HOME"
    command -v uv >/dev/null || export PATH="$HOME/.local/bin:/root/.local/bin:/usr/local/bin:$PATH"
    command -v uv >/dev/null || { curl -LsSf https://astral.sh/uv/install.sh | sh; export PATH="$HOME/.local/bin:$PATH"; }
    uv --version
    # Install under the SAME interpreter version the workload runs on, or host
    # packages can shadow the recorded pins. --with huggingface-hub because roar
    # declares it only under a `dev` extra and `roar put ... hf://` would otherwise
    # die *after* every traced step has already succeeded.
    # --index-strategy unsafe-best-match is REQUIRED: uv gives --extra-index-url
    # first-match priority and otherwise reports "no version of roar-cli==0.4.4rc2".
    uv tool install --python "$(python -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" \
      --force --with huggingface-hub \
      --index-url https://test.pypi.org/simple/ \
      --extra-index-url https://pypi.org/simple/ \
      --index-strategy unsafe-best-match \
      roar-cli==0.4.4rc2
    # The treqs agent shells out to a bare `roar` after the run WITHOUT this
    # stage's PATH, so the executable has to exist at /usr/local/bin/roar.
    ROAR_BIN="$(command -v roar || true)"
    test -n "$ROAR_BIN" || ROAR_BIN="$HOME/.local/bin/roar"
    test -x "$ROAR_BIN" || ROAR_BIN=/root/.local/bin/roar
    echo "roar installed at $ROAR_BIN"
    sudo ln -sf "$ROAR_BIN" /usr/local/bin/roar
    hash -r
    roar --version
    test "$(roar --version | grep -o '[0-9][^ ]*$')" = "0.4.4rc2" || { echo "WRONG ROAR: $(roar --version)"; exit 1; }
    roar tracer use preload
    roar tracer
    roar init || true
  trace: off

fetch_dataset:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n fetch_dataset --wandb-to-trackio -- python reproduction/fetch_fashion_mnist.py --data-dir ./data
  trace: off

train:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n train --wandb-to-trackio -- python train.py --data-dir ./data --dataset torch/fashion_mnist --train-split train --val-split validation --model resnet18 --num-classes 10 --in-chans 1 --img-size 28 --mean 0.2860 --std 0.3530 --batch-size 256 --epochs 5 --warmup-epochs 0 --opt sgd --lr 0.05 --weight-decay 5e-4 --sched cosine --workers 0 --seed 42 --checkpoint-hist 5 --output ./output --experiment resnet18-fashion-mnist
  trace: off

evaluate:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n evaluate --wandb-to-trackio -- python validate.py --data-dir ./data --dataset torch/fashion_mnist --split validation --model resnet18 --num-classes 10 --in-chans 1 --img-size 28 --mean 0.2860 --std 0.3530 --crop-pct 1.0 --batch-size 256 --workers 0 --checkpoint ./output/resnet18-fashion-mnist/model_best.pth.tar --results-file ./metrics/eval.json --results-format json
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact output/resnet18-fashion-mnist/model_best.pth.tar model.name=timm-resnet18-fashion-mnist model.version=1 license.id=Apache-2.0 license.name='Apache License 2.0' description='ResNet-18 image classifier trained from scratch on Fashion-MNIST at 28x28 for 5 epochs with the timm training script — a deliberately TRUNCATED run, not a converged timm recipe.' documentation.url=https://github.com/reproducible-ai/pytorch-image-models/blob/main/reproduction/README.md
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar put output/resnet18-fashion-mnist/model_best.pth.tar hf://reproducible-ai/timm-classifier --public --yes --no-tag -m "resnet18 trained from scratch on Fashion-MNIST (28px, 5 epochs, batch 256) with timm/train.py — TRUNCATED run, not converged; published with its held-out top-1 metrics"
  trace: off
